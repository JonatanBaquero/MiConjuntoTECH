
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anuncios - MiConjuntoTECH</title>

    <link rel="stylesheet" href="css/styles.css">
    <script src="js/anuncios.js" defer></script>
</head>
<body>
    <nav class="sidebar">
        <div class="logo">
            <a href="index.html">
                <img src="img/logo-header.png" alt="Logo MiConjuntoTECH">
            </a>
        </div>

        <ul>
            <li><a href="index.html">Inicio</a></li>
            <li><a href="pqrs.html">PQRs</a></li>
            <li><a href="anuncios.html">Anuncios</a></li>
            <li><a href="usuarios.html">Usuarios</a></li>
            <li><a href="documentos.html">Documentos</a></li>
            <li><a href="mensajes.html">Mensajes</a></li>
        </ul>
    </nav>

    <div class="main-container">
        <header class="site-header">
            <h2>Bienvenido administrador: Jony</h2>

            <div class="header-controls">
                <a href="#" class="header-icon">
                    <img src="img/avatar.png" alt="Cuenta">
                </a>

                <a href="#" class="header-icon">
                    <img src="img/herramienta.png" alt="Herramientas">
                </a>

                <button class="btn-salir"
                        onclick="alert('Salida del Sistema')">
                    Salir
                </button>
            </div>
        </header>

        <main class="content">
            <h1>Anuncios</h1>
            <p>Anuncios y novedades principales</p>

            <form class="search-container" id="form-busqueda">
                <input
                    type="search"
                    id="anuncio-search"
                    name="q"
                    placeholder="Buscar por código o palabra clave..."
                    aria-label="Buscar anuncios"
                >

                <button type="submit" class="btn-search">
                    Buscar
                </button>
            </form>

            <p id="mensaje-anuncios" role="status" aria-live="polite">
                Cargando anuncios...
            </p>

            <div class="tabla-container-anuncios">
                <table class="anuncios-table">
                    <thead>
                        <tr>
                            <th scope="col">Código</th>
                            <th scope="col">Anuncio</th>
                            <th scope="col">Fecha de publicación</th>
                            <th scope="col">Estado</th>
                            <th scope="col">Acciones</th>
                        </tr>
                    </thead>

                    <tbody id="anuncios-body">
                        <!-- JavaScript insertará aquí los anuncios de MySQL -->
                    </tbody>
                </table>
            </div>

           
<div>
    <button
        type="button"
        class="btn-salir"
        id="btn-mostrar-formulario">
        Crear anuncio
    </button>
</div>

<!-- Formulario para crear un anuncio -->
<section id="seccion-crear-anuncio" hidden>
    <h2>Nuevo anuncio</h2>

    <form id="form-crear-anuncio">
        <div>
            <label for="titulo">Título del anuncio</label>
            <input
                type="text"
                id="titulo"
                name="titulo"
                maxlength="150"
                required
                placeholder="Ej. Corte de agua programado">
        </div>

        <div>
            <label for="contenido">Descripción del anuncio</label>
            <textarea
                id="contenido"
                name="contenido"
                rows="5"
                required
                placeholder="Escribe aquí los detalles del anuncio">
            </textarea>
        </div>

        <div>
            <label for="fecha_publicacion">Fecha de publicación</label>
            <input
                type="date"
                id="fecha_publicacion"
                name="fecha_publicacion"
                required>
        </div>

        <div>
            <label for="id_admin">ID del administrador</label>
            <input
                type="number"
                id="id_admin"
                name="id_admin"
                min="1"
                required
                placeholder="Ingresa un ID válido">
        </div>

        <button type="submit" class="btn-search">
            Guardar anuncio
        </button>

        <button
            type="button"
            class="btn-salir"
            id="btn-cancelar-anuncio">
            Cancelar
        </button>
    </form>

    <p id="mensaje-formulario" role="status" aria-live="polite"></p>
</section>


        </main>

        <footer class="site-footer">
            <p>&copy; 2026 MiConjuntoTECH, Todos los derechos reservados.</p>
        </footer>
    </div>
</body>
</html>
